name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# برای گذاشتنِ فایلِ نصبی روی Release (جایگزینِ آرتیفکت وقتی سهمیهٔ آرتیفکت پر است)
permissions:
  contents: write

jobs:
  functions-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: archive/backend/functions/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node run-tests.js
      - run: find .. -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  wellness-tests:
    name: JVM tests (wellness)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: wellness unit tests
        run: |
          ./gradlew :hamyar-app:testP09DebugUnitTest \
            --tests "com.hamyareman.ir.ui.wellness.*" \
            --info --stacktrace
      - name: upload wellness reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wellness-test-results
          path: apps/hamyar-app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

  # تست‌های JVMِ بخشِ مطالعه/هنر (نگهبانِ همگامیِ HTML با فهرست‌های Books،
  # رمزنگاریِ بازه‌بازهٔ CTR، و ...). فعلاً غیرِمسدودکننده است: اگر قرمز شد،
  # بیلدِ اصلی نمی‌شکند و فقط آرتیفکت/لاگِ نتیجه می‌آید تا بررسی شود.
  study-tests:
    name: JVM tests (study/art)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: study/art unit tests
        run: |
          ./gradlew :hamyar-app:testP09DebugUnitTest \
            --tests "com.hamyareman.ir.ui.study.*" \
            --tests "com.hamyareman.ir.ui.art.*" \
            --info --stacktrace
      - name: upload study reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: study-test-results
          path: apps/hamyar-app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      # cache-cleanup: never — قدمِ «پاک‌سازیِ کش» در انتهای کار یک بیلدِ جدا اجرا می‌کند
      # و طبق باگِ شناخته‌شده‌ی Gradle گاهی بیش از نیم‌ساعت تا یک ساعت فریز می‌کند؛
      # در حالی که خودِ بیلد و آپلودِ APK مدت‌ها قبل تمام شده است.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - run: ./gradlew :core-common:testDebugUnitTest :hamyar-app:testP09DebugUnitTest :hamyar-app:assembleP09Debug :hamyar-app:lintP09Debug :hamyar-admin:assembleDebug --stacktrace
      - name: Upload debug APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-app-debug-apk
          path: apps/hamyar-app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload admin APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-admin-debug-apk
          path: apps/hamyar-admin/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      # بیلدِ ریلیزِ R8 — عمداً **غیرِمسدودکننده**: مسیرِ اصلیِ انتشار همان بیلدِ
      # دیباگ است. اگر R8 روی کدِ تازه بشکند، این قدم قرمز میشود ولی کارِ بقیه
      # متوقف نمیشود؛ اگر سبز شد، حجمِ نسخهٔ کوچکشده در لاگ/آرتیفکت دیده میشود.
      - name: release APK (R8) — غیرِمسدودکننده
        continue-on-error: true
        run: |
          ./gradlew :hamyar-app:assembleP09Release --stacktrace
          for f in apps/hamyar-app/build/outputs/apk/**/*.apk; do
            printf '%-70s %s مگابایت\n' "$f" "$(( $(stat -c%s "$f") / 1048576 ))"
          done
      - name: upload release APK
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-app-release-apk
          path: apps/hamyar-app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      # ---- مسیرِ دومِ تحویلِ فایلِ نصبی: داراییِ Release در همین مخزن ----
      # چرا: سهمیهٔ «آرتیفکت» گیت‌هاب پر می‌شود و آن‌وقت هیچ APKی بالا نمی‌آید.
      # Release سهمیهٔ جدا دارد و همیشه کار می‌کند.
      - name: انتشارِ APK روی Release (ci-apk)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view ci-apk >/dev/null 2>&1 || \
            gh release create ci-apk --title "CI APK" --notes "آخرین فایل‌های نصبیِ ساختهٔ CI (نسخهٔ debug و R8)." || true
          shopt -s nullglob
          shopt -s globstar
          for f in apps/hamyar-app/build/outputs/apk/**/*.apk apps/hamyar-admin/build/outputs/apk/**/*.apk; do
            echo "↑ $f"
            gh release upload ci-apk "$f" --clobber
          done
