name: Android validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  functions-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node run-tests.js
      - run: find .. -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :hamyar-app:assembleDebug :hamyar-app:lintDebug --stacktrace
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-app-debug-apk
          path: apps/hamyar-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
