name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  functions-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/backend/functions/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node run-tests.js
      - run: find .. -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  wellness-tests:
    name: JVM tests (wellness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: wellness unit tests
        run: |
          ./gradlew :hamyar-app:testDebugUnitTest \
            --tests "com.hamyareman.ir.ui.wellness.*" \
            --info --stacktrace
      - name: upload wellness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellness-test-results
          path: apps/hamyar-app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

  # تست‌های JVMِ بخشِ مطالعه/هنر (نگهبانِ همگامیِ HTML با فهرست‌های Books،
  # رمزنگاریِ بازه‌بازهٔ CTR، و ...). فعلاً غیرِمسدودکننده است: اگر قرمز شد،
  # بیلدِ اصلی نمی‌شکند و فقط آرتیفکت/لاگِ نتیجه می‌آید تا بررسی شود.
  study-tests:
    name: JVM tests (study/art)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: study/art unit tests
        run: |
          ./gradlew :hamyar-app:testDebugUnitTest \
            --tests "com.hamyareman.ir.ui.study.*" \
            --tests "com.hamyareman.ir.ui.art.*" \
            --info --stacktrace
      - name: upload study reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-test-results
          path: apps/hamyar-app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      # cache-cleanup: never — قدمِ «پاک‌سازیِ کش» در انتهای کار یک بیلدِ جدا اجرا می‌کند
      # و طبق باگِ شناخته‌شده‌ی Gradle گاهی بیش از نیم‌ساعت تا یک ساعت فریز می‌کند؛
      # در حالی که خودِ بیلد و آپلودِ APK مدت‌ها قبل تمام شده است.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - run: ./gradlew test :hamyar-app:assembleDebug :hamyar-app:lintDebug --stacktrace
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-app-debug-apk
          path: apps/hamyar-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
