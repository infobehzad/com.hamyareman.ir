name: CI

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

# یک جاب، فقط نهمِ دیباگ — بدون ادمین/R8/lint/تست تکراری تا سهمیهٔ Actions زود تمام نشود.
permissions:
  contents: write
  actions: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
      - name: ساخت APK
        run: |
          set +e
          ./gradlew :hamyar-app:assembleP09Debug --stacktrace > build_log.txt 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "=== BUILD LOG TAIL ==="
            tail -n 120 build_log.txt
            exit $CODE
          fi
          set -e
      - name: ثبت لاگ خطا در برنچ دیباگ
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp -f build_log.txt build_error.log || true
          git add -f build_error.log
          git commit -m "ci: debug log" || true
          git push -f origin debug-log || true
      - name: نام‌گذاری APK
        run: |
          set -e
          shopt -s nullglob globstar
          src=$(echo apps/hamyar-app/build/outputs/apk/**/*.apk | awk '{print $1}')
          test -n "$src" && test -f "$src"
          mkdir -p dist
          cp -f "$src" dist/hamyar-1.98.apk
          ls -l dist/hamyar-1.98.apk
      - name: انتشارِ APK روی Release (ci-apk)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view ci-apk >/dev/null 2>&1 || \
            gh release create ci-apk --title "CI APK" --notes "آخرین فایل نصبی debug نهم." || true
          gh release upload ci-apk dist/hamyar-1.98.apk --clobber
          gh release view ci-apk
      - name: آپلود در باکت ایرانی آروان (پوشه apk و ریشه)
        if: success()
        continue-on-error: true
        timeout-minutes: 3
        env:
          ARVAN_ACCESS_KEY: ${{ secrets.ARVAN_ACCESS_KEY }}
          ARVAN_SECRET_KEY: ${{ secrets.ARVAN_SECRET_KEY }}
          ASSET: "hamyar-1.98.apk"
        run: |
          if [ -z "${ARVAN_ACCESS_KEY:-}" ] || [ -z "${ARVAN_SECRET_KEY:-}" ]; then
            echo "Arvan keys not configured in secrets, skipping S3 upload."
            exit 0
          fi
          pip install --quiet boto3
          python3 - <<'PY'
          import os, socket
          socket.setdefaulttimeout(30)
          from pathlib import Path
          import boto3
          from botocore.config import Config
          from boto3.s3.transfer import TransferConfig

          name = os.environ["ASSET"]
          file_path = str(Path("dist", name).resolve())
          file_size = os.path.getsize(file_path)

          s3 = boto3.client(
              "s3",
              aws_access_key_id=os.environ["ARVAN_ACCESS_KEY"],
              aws_secret_access_key=os.environ["ARVAN_SECRET_KEY"],
              endpoint_url="https://s3.ir-thr-at1.arvanstorage.ir",
              region_name="ir-thr-at1",
              config=Config(
                  signature_version="s3v4",
                  s3={"addressing_style": "path"},
                  connect_timeout=10,
                  read_timeout=30,
                  retries={"max_attempts": 1},
              ),
          )
          transfer_config = TransferConfig(
              multipart_threshold=8 * 1024 * 1024,
              max_concurrency=2,
              multipart_chunksize=8 * 1024 * 1024,
              use_threads=True,
          )
          extra = {"ContentType": "application/vnd.android.package-archive"}
          for key in [f"apk/{name}", name]:
              try:
                  s3.upload_file(file_path, "hamyar-e-man", key, ExtraArgs={**extra, "ACL": "public-read"}, Config=transfer_config)
                  print(f"arvan s3 upload ok: {key} ({file_size} bytes)")
              except Exception as e:
                  try:
                      s3.upload_file(file_path, "hamyar-e-man", key, ExtraArgs=extra, Config=transfer_config)
                      print(f"arvan s3 upload fallback ok: {key} ({file_size} bytes)")
                  except Exception as ex:
                      print(f"arvan s3 upload notice for {key}: {ex}")
          PY
      - name: تنظیم آپدیت اجباری از سرور ایرانی در Appwrite
        if: success()
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || '6a9d59e3002751cc3ea8' }}
        run: |
          if [ -z "${APPWRITE_API_KEY:-}" ]; then
            echo "APPWRITE_API_KEY secret not found, skipping Appwrite release update."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, time, urllib.request

          key = os.environ['APPWRITE_API_KEY']
          project = os.environ.get('APPWRITE_PROJECT_ID') or '6a9d59e3002751cc3ea8'
          base = 'https://fra.cloud.appwrite.io/v1'

          # تنظیمات آپدیت اجباری با لینک مستقیم سرور ایرانی آروان
          payload = {
              'latest': 99,
              'name': '1.98',
              'min': 99,
              'url': 'https://hamyar-e-man.s3.ir-thr-at1.arvanstorage.ir/apk/hamyar-1.98.apk',
              'size': 55000000,
              'sha256': '',
              'chan': 'stable',
              'rollout': 100,
              'notes': [
                  'نمایش تمام‌صفحه و مخفی‌سازی سربرگ در تمام صفحات HTML و ابزارها',
                  'کوچک‌تر شدن ۲۰ درصدی کاشی‌های سلامتی، آموزشگاه، کسب آگاهی و ذهن‌آگاهی با کادر فیکس و فونت تطبیقی',
                  'تطبیق کامل ۱۰ دسته‌بندی آموزشگاه با ۳۴ فایل تعاملی HTML و حذف متفرقه و هوش مصنوعی',
                  'نوسازی گرافیکی فضای امن من با قفل بیومتریک/PIN، ۴ دفترچه سینک‌شونده و آلبوم امن آفلاین با بکاپ/بازگردانی',
                  'چرخش ۱۸۰ درجه تصویر دفترچه جزوه‌ها، حذف خط قرمز و فونت ۳ سایز بزرگتر و بولد',
                  'مدیریت دانلود محتوا و به‌روزرسانی بخش تنظیمات، درباره ما و تماس با ما',
              ],
          }

          body = json.dumps({
              'data': {
                  'userId': 'global',
                  'key': 'app_release',
                  'payload': json.dumps(payload, ensure_ascii=False, separators=(',', ':')),
                  'updatedAt': int(time.time() * 1000),
              },
              'permissions': ['read("users")'],
          }, ensure_ascii=False).encode()

          req = urllib.request.Request(
              f'{base}/databases/ZahraDB/collections/app_state/documents/app_release',
              data=body, method='PATCH')
          req.add_header('X-Appwrite-Project', project)
          req.add_header('X-Appwrite-Key', key)
          req.add_header('Content-Type', 'application/json')
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print('تنظیمات آپدیت اجباری روی Appwrite با موفقیت به‌روز شد:', r.status)
          except Exception as e:
              print('خطا در ارتباط با Appwrite:', e)
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hamyar-1.98-debug
          path: dist/hamyar-1.98.apk
          if-no-files-found: error
          retention-days: 3
