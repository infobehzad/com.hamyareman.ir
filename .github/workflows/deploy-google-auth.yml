name: Deploy google-auth function

# ورود native گوگل — به‌صورت mode=google-auth روی فانکشن موجود ai-companion
# (پلن رایگان سقف functions دارد؛ الگوی همان study-tutor).
on:
  workflow_dispatch:

jobs:
  deploy:
    name: deploy google-auth mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🚀 Deploy (scopes + build + smoke ×4)
        run: python3 archive/backend/functions/google-auth/deploy.py
