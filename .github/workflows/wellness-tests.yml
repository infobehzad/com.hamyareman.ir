name: Wellness unit tests

# تست‌های JVM خالص برای WellnessCatalog و WellnessTimingProvider
# (نیاز به Android SDK یا اپراتور سیستم ندارد)
# این workflow روی هر push و PR اجرا می‌شود.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    paths:
      - 'apps/hamyar-app/src/**'
      - 'apps/hamyar-app/src/test/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/wellness-tests.yml'

jobs:
  wellness-tests:
    name: JVM tests (wellness)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # تست‌های :hamyar-app به SDK اندروید نیاز دارند (کامپایل ماژول‌های اندروید).
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🧪 اجرای تست‌های wellness
        run: |
          ./gradlew :hamyar-app:testDebugUnitTest \
            --tests "com.hamyareman.ir.ui.wellness.*" \
            --info --stacktrace

      - name: 📊 گزارش تست
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "  📋 گزارش تست‌های wellness"
          echo "═══════════════════════════════════════"
          REPORT_DIR="apps/hamyar-app/build/test-results/testDebugUnitTest"
          if [ -d "$REPORT_DIR" ]; then
            echo "  فایل‌های گزارش:"
            find "$REPORT_DIR" -name "*.xml" -type f | wc -l | xargs -I {} echo "    {} فایل XML"
            echo ""
            echo "  نتیجه:"
            grep -h "testsuite" "$REPORT_DIR"/TEST-*.xml 2>/dev/null | \
              sed -E 's/.*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*skipped="([0-9]+)".*/    tests=\1 failures=\2 errors=\3 skipped=\4/' | \
              head -20
          else
            echo "  ❌ پوشه‌ی گزارش پیدا نشد."
          fi
          echo "═══════════════════════════════════════"

      - name: 📤 آپلود artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellness-test-results
          path: apps/hamyar-app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
